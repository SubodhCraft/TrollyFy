{% extends 'base.html' %}

{% block title %}Reset Password | Trollyfy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-5">
            <div class="card-header bg-primary text-white py-4 text-center">
                <i class="bi bi-shield-lock display-4 mb-2 d-block"></i>
                <h3 class="fw-bold mb-0">Reset Password</h3>
                <p class="mb-0 opacity-75 small">Enter your email to receive recovery instructions</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="id_email" class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" id="id_email" class="form-control form-control-lg rounded-pill" placeholder="name@university.edu" required>
                        <div class="form-text small mt-2">
                            We will email you a secure link to reset your account credentials.
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                            Send Reset Link
                        </button>
                        <a href="{% url 'login' %}" class="btn btn-link text-decoration-none text-muted small">
                            Return to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
