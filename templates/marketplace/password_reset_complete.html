{% extends 'base.html' %}

{% block title %}Reset Complete | Trollyfy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-5 text-center">
            <div class="card-header bg-success text-white py-5">
                <i class="bi bi-check-circle display-1 mb-3 d-block"></i>
                <h3 class="fw-bold mb-0">Success!</h3>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <p class="text-secondary lead">Your password has been securely updated.</p>
                <p class="small text-muted mb-4">You can now use your new credentials to access your account and resume trading on campus.</p>
                
                <div class="d-grid">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                        Access Account / Log In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
